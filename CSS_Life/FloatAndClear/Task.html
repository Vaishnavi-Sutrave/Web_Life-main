<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
       
    .container{
        width: 500px ;
        height: 500px;
        border: 5px solid blue;
        position: relative;
    }

    .box{
        width:100px ;
        height: 100px;
        border: 2px solid green;
    }

    #box1{
         position:absolute;        
          top:0px; 

    }
    #box2{
        position: relative;
        left: 400px;
    }
    #box3{
        position: relative;
        left: 200px;
        bottom: -100px;
    }
    #box4{
        position: absolute;
        bottom: -5px;
    }
    #box5{
        position: absolute;
      bottom: -5px;
       left:400px
    }



</style>
</head>
<body>
    <div class="container">

        <div class="box"  id="box1" >box1</div>
        <div class="box"  id="box2" >box2</div>
        <div class="box"  id="box3" >box3</div>
        <div class="box"  id="box4" >box4</div>
        <div class="box"  id="box5" >box5</div>


    </div>
</body>
</html>
