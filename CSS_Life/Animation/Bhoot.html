<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        background-color: black;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .main{
        width: 600px;
        height: 600px;
        border:3px solid white;
        position: relative;
        animation: Bhoot 5s infinite linear;
        border-radius: 50%;
        box-shadow: 5px 5px 5px white;
    }
    .child{
        width: 100px;
        height: 100px;
        background-color: gold;
        position: absolute;
        top: 80px;
        border-radius: 50%;
        box-shadow: 3px 4px 6px 2px orange;
        
       
    }
        @keyframes Bhoot{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);

            }
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="child">
            <!-- <img src="https://t4.ftcdn.net/jpg/08/98/43/11/360_F_898431162_ZOidCG6IdtIOuikcaiayaDeHQWWdiKAX.jpg" alt="" width="200" height="200"> -->

        </div>
    </div>
</body>
</html>
